<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:image" content="https://fortenergi.no/og-image.png">
<meta name="twitter:image" content="https://fortenergi.no/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<title>Siden finnes ikke — Fortenergi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--black:#111111;--lime:#C6F432;--spruce:#1F4D3A;--white:#FFFFFF;--muted:#B8C0B4;--line:#2A2A2A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--black);color:var(--white)}
body{font-family:Roboto,Helvetica,sans-serif;line-height:1.55;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1.25rem}
main{width:100%;max-width:36rem}
.brand{font-family:Oswald,Impact,sans-serif;font-size:1.5rem;font-weight:700;margin:0;color:var(--white);text-decoration:none;letter-spacing:.1em;text-transform:uppercase}
.brand span{color:var(--lime)}
.rubro{margin:.15rem 0 0;color:var(--muted);font-size:.95rem}
.code{font-family:Oswald,Impact,sans-serif;font-size:clamp(4.5rem,18vw,7rem);line-height:1;font-weight:700;color:var(--lime);margin:2rem 0 .5rem}
h1{font-family:Oswald,Impact,sans-serif;font-weight:700;margin:0 0 .5rem;font-size:1.8rem;text-transform:uppercase}
p{margin:0 0 1rem;color:var(--muted)}
.actions{margin-top:1.75rem;display:flex;flex-wrap:wrap;align-items:center;gap:.75rem 1.25rem}
.btn{display:inline-block;background:var(--lime);color:var(--black);text-decoration:none;padding:.8rem 1.4rem;font-family:Oswald,Impact,sans-serif;font-weight:600;text-align:center;text-transform:uppercase;letter-spacing:.06em}
.btn:hover,.btn:focus-visible{background:var(--white)}
.actions a:not(.btn){color:var(--muted);text-underline-offset:3px}
.contact{color:var(--muted);font-size:.95rem}
@media (max-width:480px){.actions{flex-direction:column;align-items:stretch}.btn{width:100%}}
</style>
<meta name="twitter:title" content="Siden finnes ikke — Fortenergi">
</head>
<body>
<main>
<a class="brand" href="/">Fort<span>energi</span></a>
<p class="rubro">Trening og friluftsliv</p>
<div class="code" aria-hidden="true">404</div>
<h1>Siden finnes ikke</h1>
<p>Lenken kan være utdatert, eller siden er flyttet. Gå tilbake til butikken og fortsett derfra.</p>
<div class="actions">
<a class="btn" href="/">Til forsiden</a>
<a href="/#shop">Se produktene</a>
<a href="/kontakt">Kontakt</a>
</div>
<p class="contact">Spørsmål? <a href="mailto:kontakt@fortenergi.no">kontakt@fortenergi.no</a></p>
</main>
</body>
</html>
